services:
  classroom-notifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot-classroom-notifier
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

